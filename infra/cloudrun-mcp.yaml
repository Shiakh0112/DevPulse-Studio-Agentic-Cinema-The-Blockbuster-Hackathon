apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: devpulse-mcp-clickhouse
  labels:
    cloud.googleapis.com/location: us-central1
    app: devpulse-studio
    component: mcp-server
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "5"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/client-name: gcloud
    spec:
      serviceAccountName: sa-mcp-clickhouse@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/devpulse-mcp-clickhouse:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: 1000m
          env:
            - name: CLICKHOUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: clickhouse-host
                  key: latest
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-password
                  key: latest
